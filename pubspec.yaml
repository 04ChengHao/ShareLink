name: share_link
description: "享联-ShareLink - 跨设备无缝互联，文件即取即用，剪贴板跨屏同步。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # iOS style icons
  cupertino_icons: ^1.0.8

  # SMB 局域网文件访问
  dart_smb2: ^0.1.1

  # 剪贴板监听与操作（官方维护，支持文本/富文本/图片 + 原生监听）
  # clipboard: ^3.0.14

  # 跨设备传输剪贴板内容 / 系统分享
  share_plus: ^13.1.0

  # WebSocket 实时通信
  web_socket_channel: ^3.0.3

  # 网络信息
  network_info_plus: ^8.2.1

  # mDNS 服务发现
  multicast_dns: ^0.3.3+1

  # 状态管理
  flutter_riverpod: ^3.4.2

  # 本地存储
  shared_preferences: ^2.5.5

  # 后台服务
  flutter_background_service: ^5.1.0

  # 窗口管理（桌面端自定义标题栏）
  window_manager: ^0.5.2

  # 系统托盘（桌面端最小化到托盘）
  tray_manager: ^0.5.0

  # 统一弹窗系统（Toast / Loading / Confirm / Sheet 等）
  unified_popups: ^2.0.5

  # 设备信息（读取真实设备名称和型号）
  device_info_plus: ^13.2.0

  # 日志
  logger: ^2.7.0

  # 文件/目录选择器（共享文件夹选择）
  file_picker: ^12.0.0-beta.1

  # 权限请求（相册/存储等运行时权限）
  permission_handler: ^12.0.0+1

  # 系统文件打开（调用系统默认应用打开文件）
  open_filex: ^4.5.0

  # 视频缩略图生成（原生 API，支持 Android/iOS/macOS/Windows/Linux）
  fc_native_video_thumbnail: ^3.0.1

  # 图片缩放查看
  photo_view: ^0.15.0

  # 网络图片缓存（磁盘持久化缓存，避免重复下载）
  cached_network_image: ^3.4.1

  # 媒体播放（基于 libmpv，全平台统一支持 Windows/macOS/Linux/Android/iOS/Web）
  # 替代 video_player + just_audio，解决 Windows 端无原生实现的 MissingPluginException
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.10
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_linux: ^1.1.3

  # 屏幕亮度控制（手机端视频播放器左侧上下滑动调亮度）
  screen_brightness: ^2.1.11

  # 系统音量控制（视频播放器右侧上下滑动调系统音量，退出时恢复）
  volume_controller: ^3.6.0

  # 文件路径相关（缓存目录访问）
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see
# the following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true

  assets:
    - assets/
